<script>
(async () => {
  const m = document.getElementById('m');
  try {
    const k = new URLSearchParams(location.hash.slice(1)).get('k');
    if (!k) throw new Error('nyckel saknas');
    const b = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const [iv, ct] = document.getElementById('c').textContent.trim().split('.');
    const key = await crypto.subtle.importKey('raw', b(k), 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(iv) }, key, b(ct)));
    // document.open() rensar bara sidan när den laddat klart; annars läggs listan under laddaren
    if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
    document.open(); document.write(html); document.close();
  } catch (e) {
    m.textContent = 'Länken saknar nyckel eller är inte rätt. Be Carl om länken till QISY-ärendelistan.';
  }
})();
</script></body></html>
